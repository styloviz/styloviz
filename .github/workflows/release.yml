# Publishes @styloviz/core, every free package and the @styloviz/all bundle to
# npm on a v* tag, over trusted publishing (OIDC, no token) and with provenance.
# Each package's npm trusted publisher names styloviz / styloviz / release.yml.
# @styloviz/pro is published from the private repo. See scripts/publish.mjs.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.10
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: node scripts/publish.mjs
