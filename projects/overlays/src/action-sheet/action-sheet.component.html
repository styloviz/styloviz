<!--
  The sheet lives in an <ng-template> and is instantiated into <body> through a
  portal (SvActionSheetComponent.mount), so no scrolling or transformed ancestor
  can clip it.
-->
<ng-template #sheetTpl>
  <!--
    The root is the scrim's hit area: a tap that both starts and ends on it (not
    on the panel) dismisses. Pointer-only by design — Escape and Cancel are the
    keyboard's ways out, so it is not a tab stop and carries no name.
  -->
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
  <div
    class="fixed inset-0 flex items-end justify-center"
    [style.zIndex]="z()"
    (pointerdown)="onRootPointerDown($event)"
    (click)="onRootClick($event)"
    (keydown)="onKeydown($event)"
    data-sv-action-sheet-root
  >
    <div
      class="pointer-events-none absolute inset-0 bg-gray-950/50 transition-opacity duration-200 ease-out motion-reduce:transition-none"
      [class.opacity-0]="!shown()"
      aria-hidden="true"
      data-sv-action-sheet-scrim
    ></div>

    <div
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="title() ? titleId : null"
      [attr.aria-label]="title() ? null : (ariaLabel() || text().actionSheetName)"
      [attr.aria-describedby]="description() ? descriptionId : null"
      [attr.inert]="closing() ? '' : null"
      class="relative flex max-h-[85dvh] w-full max-w-md flex-col gap-2 px-2 pt-2 ease-out focus:outline-none sm:pb-4
             motion-reduce:transition-none"
      [ngClass]="dragging() ? 'transition-none' : 'transition-transform duration-200'"
      [style.transform]="panelTransform()"
      [style.padding-bottom]="safeArea"
      data-sv-action-sheet
    >
      <div class="flex min-h-0 flex-col overflow-hidden rounded-2xl bg-white shadow-xl ring-1 ring-gray-900/5 dark:bg-gray-900 dark:ring-white/10">
        <!--
          The grab handle and heading start a swipe down (touch and pen only). A
          mouse drag here is a text selection, and the list below keeps its own
          scroll — so the gesture never fights the menu. Pointer-only by design:
          Cancel, Escape and the scrim are the ways out without a drag.
        -->
        <div
          class="shrink-0 touch-none select-none px-4 pb-2 pt-2 text-center"
          (pointerdown)="onHandlePointerDown($event)"
          data-sv-action-sheet-handle
        >
          <span class="mx-auto mb-2 block h-1 w-10 rounded-full bg-gray-300 dark:bg-gray-600" aria-hidden="true"></span>
          @if (title()) {
            <h2 [id]="titleId" class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ title() }}</h2>
          }
          @if (description()) {
            <p [id]="descriptionId" class="mt-0.5 text-xs text-gray-600 dark:text-gray-400">{{ description() }}</p>
          }
        </div>

        @if (actions().length) {
        <!-- The menu takes its keys from the focused menuitem (one roving tab stop), so the container itself is not a stop. -->
        <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
        <div
          role="menu"
          [attr.aria-labelledby]="title() ? titleId : null"
          [attr.aria-label]="title() ? null : (ariaLabel() || text().actionSheetName)"
          aria-orientation="vertical"
          class="min-h-0 overflow-y-auto overscroll-contain border-t border-gray-100 dark:border-gray-800"
          (keydown)="onMenuKeydown($event)"
        >
          @for (action of actions(); track action.id; let i = $index) {
            <button
              type="button"
              role="menuitem"
              data-sv-action-sheet-item
              [attr.data-sv-action-id]="action.id"
              [attr.tabindex]="i === activeIndex() ? 0 : -1"
              [attr.aria-disabled]="action.disabled ? 'true' : null"
              [ngClass]="[
                'flex min-h-12 w-full items-center gap-3 px-4 py-3 text-start text-[15px] transition-colors',
                'focus:outline-none focus-visible:bg-gray-100 focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-500 dark:focus-visible:bg-gray-800',
                action.disabled
                  ? 'cursor-not-allowed text-gray-400 dark:text-gray-500'
                  : action.destructive
                    ? 'font-medium text-danger-700 hover:bg-danger-50 dark:text-danger-400 dark:hover:bg-danger-500/10'
                    : 'text-gray-900 hover:bg-gray-50 dark:text-gray-100 dark:hover:bg-gray-800/70'
              ]"
              (click)="choose(action, i)"
            >
              @if (action.icon) {
                <sv-icon [name]="action.icon" cssClass="h-5 w-5 shrink-0" [strokeWidth]="1.8" />
              }
              <span class="min-w-0 flex-1">
                <span class="block truncate">{{ action.label }}</span>
                @if (action.description) {
                  <span class="mt-0.5 block text-xs font-normal text-gray-600 dark:text-gray-400">{{ action.description }}</span>
                }
              </span>
              @if (action.destructive) {
                <span class="sr-only">{{ text().actionSheetDestructive }}</span>
              }
            </button>
          }
        </div>
        }
      </div>

      @if (showCancel()) {
        <button
          type="button"
          data-sv-action-sheet-cancel
          class="min-h-12 w-full shrink-0 rounded-2xl bg-white py-3 text-[15px] font-semibold text-gray-900 shadow-xl ring-1 ring-gray-900/5
                 transition-colors hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500
                 dark:bg-gray-900 dark:text-gray-100 dark:ring-white/10 dark:hover:bg-gray-800"
          (click)="close('cancel')"
        >{{ cancelText() }}</button>
      }
    </div>
  </div>
</ng-template>
