<div class="flex flex-wrap items-center gap-0.5" role="group" [attr.aria-label]="ariaLabel() ?? t().messageActions" data-sv-message-actions>
  <ng-content />

  @if (shown().copy) {
    <button type="button" (click)="copy()"
            class="flex h-6 w-6 items-center justify-center rounded-md text-gray-500
                   hover:bg-gray-100 hover:text-gray-700
                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500/60
                   dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200"
            [attr.data-sv-copy-state]="copyState()"
            [attr.aria-label]="copyLabel()">
      @switch (copyState()) {
        @case ('copied') {
          <sv-icon name="check" cssClass="h-3.5 w-3.5 text-accent-500" [strokeWidth]="2" />
        }
        @case ('failed') {
          <sv-icon name="alert-triangle" cssClass="h-3.5 w-3.5 text-warning-500" [strokeWidth]="2" />
        }
        @default {
          <sv-icon name="copy" cssClass="h-3.5 w-3.5" [strokeWidth]="1.8" />
        }
      }
    </button>
    <!-- ★★★ THE FALLBACK IS AN AFFORDANCE, NOT AN APOLOGY. It says which keys to
         press, so the reader is not left wondering whether anything happened. -->
    @if (copyState() === 'failed') {
      <span class="text-[10px] leading-relaxed text-warning-800 dark:text-warning-200" role="status" data-sv-copy-fallback>
        {{ fallbackHint() }}
      </span>
    }
  }

  @if (shown().like) {
    <button type="button" (click)="rate('up')"
            [class]="feedback() === 'up' ? 'text-accent-500' : 'text-gray-500 hover:text-accent-500 dark:text-gray-400'"
            class="flex h-6 w-6 items-center justify-center rounded-md
                   hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500/60
                   dark:hover:bg-gray-800"
            [attr.aria-pressed]="feedback() === 'up'"
            [attr.aria-label]="t().markHelpful">
      <sv-icon name="thumbs-up" cssClass="h-3.5 w-3.5" [strokeWidth]="1.8" />
    </button>
  }

  @if (shown().dislike) {
    <button type="button" (click)="rate('down')"
            [class]="feedback() === 'down' ? 'text-danger-500' : 'text-gray-500 hover:text-danger-500 dark:text-gray-400'"
            class="flex h-6 w-6 items-center justify-center rounded-md
                   hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500/60
                   dark:hover:bg-gray-800"
            [attr.aria-pressed]="feedback() === 'down'"
            [attr.aria-label]="t().markNotHelpful">
      <sv-icon name="thumbs-down" cssClass="h-3.5 w-3.5" [strokeWidth]="1.8" />
    </button>
  }

  @if (shown().regenerate) {
    <button type="button" (click)="regenerate.emit()"
            class="flex h-6 w-6 items-center justify-center rounded-md text-gray-500
                   hover:bg-gray-100 hover:text-primary-600
                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500/60
                   dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-primary-400"
            [attr.aria-label]="t().regenerate">
      <sv-icon name="refresh-cw" cssClass="h-3.5 w-3.5" [strokeWidth]="1.8" />
    </button>
  }
</div>
