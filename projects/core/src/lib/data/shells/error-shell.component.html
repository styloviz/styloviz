@if (normalized()) {
  <div
    role="alert"
    [class]="
      (compact()
        ? 'flex w-full items-center gap-3 rounded-lg border border-danger-200 bg-danger-50/60 px-3 py-2 text-left dark:border-danger-900/50 dark:bg-danger-950/30'
        : 'flex w-full flex-col items-center gap-3 px-6 py-12 text-center') +
      ' ' + customClass()
    "
  >
    <span class="shrink-0 text-danger-500 dark:text-danger-400" aria-hidden="true">
      <ng-content select="[svShellIcon]" />
    </span>

    <div [class]="compact() ? 'min-w-0 flex-1' : 'space-y-1'">
      @if (!compact()) {
        <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ title() }}</p>
      }
      <p class="text-sm text-gray-600 dark:text-gray-400">
        {{ message() }}
        @if (status(); as code) {
          <span class="ml-1 text-xs text-gray-500 dark:text-gray-400">({{ code }})</span>
        }
      </p>
    </div>

    @if (canRetry()) {
      <button
        #retryButton
        type="button"
        (click)="retry.emit()"
        [class]="
          compact()
            ? 'shrink-0 rounded-md px-2 py-1 text-xs font-medium text-primary-600 transition-colors hover:bg-primary-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500 dark:text-primary-400 dark:hover:bg-primary-950/40'
            : 'mt-1 rounded-lg bg-primary-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500'
        "
      >
        {{ retryLabel() }}
      </button>
    }
  </div>
}
