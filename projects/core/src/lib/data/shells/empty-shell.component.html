<div
  [class]="
    (compact()
      ? 'flex w-full items-center gap-3 px-3 py-4 text-left'
      : 'flex w-full flex-col items-center gap-2 px-6 py-14 text-center') +
    ' ' + customClass()
  "
>
  <span class="shrink-0 text-gray-300 dark:text-gray-600" aria-hidden="true">
    <ng-content select="[svShellIcon]" />
  </span>

  <div [class]="compact() ? 'min-w-0 flex-1' : 'space-y-1'">
    <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ resolvedTitle() }}</p>
    <p class="text-sm text-gray-500 dark:text-gray-400">{{ resolvedMessage() }}</p>
  </div>

  @if (resolvedAction(); as label) {
    <button
      type="button"
      (click)="action.emit()"
      [class]="
        (compact() ? 'shrink-0 text-xs' : 'mt-2 text-sm') +
        ' rounded-md px-2 py-1 font-medium text-primary-600 transition-colors hover:bg-primary-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-500 dark:text-primary-400 dark:hover:bg-primary-950/40'
      "
    >
      {{ label }}
    </button>
  }

  <ng-content />
</div>
