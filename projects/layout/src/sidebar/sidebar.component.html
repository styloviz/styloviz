<!-- ============================================================
     Sidebar — expanded / collapsed rail / mobile overlay.
     Glass is allowed: the panel is fixed, so its backdrop moves.

     ★ RTL (FL-J3-LU-02): pinned to the inline START (`start-0`, `border-e`),
       so under dir="rtl" it is on the right — and a closed overlay slides off
       to the right (`rtl:translate-x-full`). That one is scoped `max-lg:`:
       Tailwind emits `rtl:` after `lg:`, so unscoped it would beat
       `lg:translate-x-0` and hide the desktop sidebar in RTL.

     ★ A CLOSED overlay is `invisible` below `lg` (FL-J3-LU-07), not just
       translated away: off-canvas alone left every link in it in the tab
       order and the accessibility tree — Tab walked into a drawer nobody
       could see. `visibility` is in the transition list, so it flips to
       hidden only when the slide-out ends and to visible as the slide-in
       starts. From `lg` up the panel is always on screen and never hidden.
     ============================================================ -->

<aside
  class="top-0 start-0 z-50 flex h-full flex-col border-e border-white/70 bg-white/78
         shadow-[0_24px_60px_-36px_color-mix(in_oklab,var(--color-gray-900)_85%,transparent)] backdrop-blur-xl transition-[width,translate,visibility] duration-300 motion-reduce:transition-none
         dark:border-gray-700/45 dark:bg-gray-900/70 dark:shadow-[0_26px_64px_-38px_color-mix(in_oklab,var(--color-gray-950)_95%,transparent)]
         lg:translate-x-0"
  [class.fixed]="!isContained()"
  [class.absolute]="isContained()"
  [class.w-64]="!isCollapsed()"
  [class.w-20]="isCollapsed()"
  [class.-translate-x-full]="!isMobileOpen()"
  [class.max-lg:rtl:translate-x-full]="!isMobileOpen()"
  [class.max-lg:invisible]="!isMobileOpen()"
  [class.translate-x-0]="isMobileOpen()"
  [attr.data-collapsed]="isCollapsed() ? 'true' : null"
  [attr.aria-label]="label()">

  <!-- Brand — the same height as sv-topbar -->
  <div class="flex h-16 shrink-0 items-center border-b border-gray-200/80 px-3 dark:border-gray-800/60"
       [class.justify-center]="isCollapsed()">
    <ng-content select="[svSidebarBrand]" />
  </div>

  <!-- Navigation -->
  <div class="flex-1 overflow-y-auto px-2.5 py-3">
    <ng-content />
  </div>

  <!-- Pinned footer -->
  <div class="shrink-0 border-t border-gray-200/80 px-2.5 py-2.5 empty:hidden dark:border-gray-800/60">
    <ng-content select="[svSidebarFooter]" />
  </div>
</aside>
