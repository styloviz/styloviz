<!-- ============================================================
     Dashboard shell — [svShellSidebar] · [svShellTopbar] · page · [svShellFooter]

     RTL (FL-J3-LU-02): the content is offset on the inline START (`lg:ms-*`),
     where the sidebar is pinned, so under dir="rtl" both mirror together.
     ============================================================ -->

<div class="relative flex overflow-hidden bg-[linear-gradient(180deg,var(--color-gray-50)_0%,var(--color-brandaccent-50)_48%,var(--color-info-50)_100%)] dark:bg-[linear-gradient(180deg,var(--color-gray-950)_0%,var(--color-gray-900)_52%,var(--color-gray-900)_100%)]"
     [class.h-dvh]="!contained()"
     [class.h-full]="contained()">

  <!--
    ★ Skip link (WCAG 2.4.1 Bypass Blocks, FL-J3-LU-03): the shell's FIRST
    focusable element, visually hidden until it takes focus. It moves focus to
    <main> (tabindex="-1") itself instead of following `#id` — under a
    `<base href>` a fragment link resolves against the base and navigates away.
  -->
  @if (skipLink()) {
    <a [href]="mainHref"
       class="sr-only rounded-lg bg-white px-4 py-2 text-sm font-semibold text-primary-700 shadow-lg ring-2 ring-primary-500
              focus:not-sr-only focus:absolute focus:start-3 focus:top-3 focus:z-[60] focus:outline-none
              dark:bg-gray-900 dark:text-primary-300"
       data-sv-skip-link
       (click)="skipToMain($event)">{{ skipLinkLabel() }}</a>
  }

  @if (mobileOpen()) {
    <div class="inset-0 z-40 bg-black/50 backdrop-blur-sm lg:hidden" [class.fixed]="!contained()" [class.absolute]="contained()"
         (click)="closeMobile()" aria-hidden="true"></div>
  }

  <ng-content select="[svShellSidebar]" />

  <div
    class="relative z-10 flex min-w-0 flex-1 flex-col overflow-hidden transition-[margin-inline-start] duration-300 motion-reduce:transition-none"
    [class.lg:ms-64]="sidebar() && !collapsed()"
    [class.lg:ms-20]="sidebar() && collapsed()">

    <ng-content select="[svShellTopbar]" />

    <main #main [id]="mainId" tabindex="-1"
          class="flex-1 overflow-y-auto px-4 pb-8 pt-5 focus:outline-none sm:px-6 sm:pt-6 lg:px-8 lg:pt-7">
      <div class="mx-auto w-full max-w-[1440px]">
        <ng-content />
      </div>
    </main>

    <ng-content select="[svShellFooter]" />
  </div>
</div>
