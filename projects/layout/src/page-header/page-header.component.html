<!-- ============================================================
     Page Header
     ============================================================ -->

<div class="mb-7 flex flex-col gap-3 rounded-2xl border border-white/70 bg-white/75 px-5 py-4
            shadow-[0_14px_32px_-24px_color-mix(in_oklab,var(--color-gray-900)_55%,transparent)] backdrop-blur-sm dark:border-gray-700/40
            dark:bg-gray-900/62 dark:shadow-[0_18px_38px_-28px_color-mix(in_oklab,var(--color-gray-950)_95%,transparent)] sm:flex-row sm:items-center sm:justify-between">
  <!-- Title area -->
  <div>
    <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white sm:text-[1.35rem]">
      {{ title() }}
    </h1>
    @if (subtitle()) {
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        {{ subtitle() }}
      </p>
    }
  </div>

  <!-- Actions slot (projected content) -->
  <div class="flex items-center gap-2">
    <ng-content />
  </div>
</div>
