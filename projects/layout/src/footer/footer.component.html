<!-- ============================================================
     Footer — default slot (start) · [svFooterEnd] (end)
     ============================================================ -->

<!-- No backdrop-blur: the footer scrolls WITH the page content, so a blur would
     re-read a moving backdrop on every scroll frame for no visible gain
     (STYLOVIZ_SCROLL_FLICKER_TODO SF-04). The translucent tint stays, and
     `isolate` keeps the stacking context the filter used to create. -->
<footer class="isolate border-t border-white/65 bg-white/65 px-5 py-3 dark:border-gray-700/40 dark:bg-gray-900/55">
  <div class="mx-auto flex w-full max-w-[1440px] flex-col items-center justify-between gap-1 text-[11px] text-gray-600 dark:text-gray-400 sm:flex-row">
    <div class="flex items-center gap-2"><ng-content /></div>
    <div class="flex items-center gap-2"><ng-content select="[svFooterEnd]" /></div>
  </div>
</footer>
