<!-- ============================================================
     Topbar — toggles · [topbar-start] · [topbar-search] · [topbar-actions] · theme.
     Glass is allowed: the bar is sticky, so content scrolls beneath it.
     ============================================================ -->

<header
  data-sv-sticky="page-top"
  class="sticky top-0 z-30 flex h-16 items-center gap-2 border-b border-white/70 bg-white/72
    px-4 shadow-[0_10px_26px_-22px_color-mix(in_oklab,var(--color-gray-900)_65%,transparent)] backdrop-blur-xl dark:border-gray-700/45
    dark:bg-gray-900/62 dark:shadow-[0_14px_34px_-24px_color-mix(in_oklab,var(--color-gray-950)_95%,transparent)] sm:px-5">

  <div class="flex shrink-0 items-center gap-1.5">
    @if (showSidebarToggle()) {
      <button
        type="button"
        class="rounded-lg p-2 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700
               focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-1
               dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200 lg:hidden"
        (click)="onToggleMobileSidebar()"
        [attr.aria-label]="openSidebarLabel()">
        <sv-icon name="menu" cssClass="h-5 w-5" [strokeWidth]="1.5" />
      </button>

      <button
        type="button"
        class="group hidden items-center justify-center rounded-lg border border-gray-200/80 bg-white/60 p-2
               text-gray-500 shadow-sm transition-all hover:border-gray-300 hover:bg-white hover:text-gray-800
               active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500
               focus-visible:ring-offset-1 dark:border-gray-700/70 dark:bg-gray-800/50 dark:text-gray-400
               dark:hover:border-gray-600 dark:hover:bg-gray-800 dark:hover:text-gray-100
               dark:focus-visible:ring-offset-gray-900 lg:inline-flex"
        (click)="onToggleSidebar()"
        [attr.aria-label]="isCollapsed() ? expandSidebarLabel() : collapseSidebarLabel()"
        [attr.aria-pressed]="!isCollapsed()">
        <sv-icon [name]="isCollapsed() ? 'panel-left-open' : 'panel-left-close'" cssClass="h-5 w-5" [strokeWidth]="1.6" />
      </button>
    }
    <ng-content select="[topbar-start]" />
  </div>

  <div class="min-w-0 flex-1">
    <ng-content select="[topbar-search]" />
  </div>

  <div class="flex shrink-0 items-center gap-1 sm:gap-1.5">
    <ng-content select="[topbar-actions]" />

    @if (showThemeToggle()) {
      <button
        type="button"
        class="rounded-lg p-2 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700
               focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-1
               dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-gray-200"
        (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.isDark() ? lightModeLabel() : darkModeLabel()">
        <sv-icon [name]="themeService.isDark() ? 'sun' : 'moon'" cssClass="h-5 w-5" [strokeWidth]="1.5" />
      </button>
    }
  </div>
</header>
