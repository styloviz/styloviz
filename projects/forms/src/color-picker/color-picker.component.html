<div class="inline-block">

  @if (label()) {
    <!--
      A <span>, not a <label>: the control below is a disclosure <button>, and
      `for` only associates with form elements. `aria-labelledby` on the button
      is what names it.
    -->
    <span [id]="_uid + '-label'" class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">{{ label() }}</span>
  }

  <!-- ── Trigger button ── -->
  <button type="button" [attr.aria-invalid]="fieldError.showError() ? 'true' : null"
  [attr.aria-describedby]="fieldError.showError() ? errorId() : null"
    data-trigger
    [disabled]="resolvedDisabled()"
    (click)="toggle()"
    class="inline-flex items-center border border-gray-200 bg-white shadow-sm
           transition-all duration-150 hover:border-gray-300 hover:shadow
           focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500/40
           disabled:cursor-not-allowed disabled:opacity-50
           dark:border-gray-700 dark:bg-gray-800 dark:hover:border-gray-600"
    [class]="triggerSizeClass()"
    [attr.aria-label]="triggerAriaLabel()"
    [attr.aria-expanded]="open()"
    aria-haspopup="dialog">
    <span class="shrink-0 rounded-md border border-black/10 shadow-inner"
          [class]="swatchSizeClass()"
          [style.background]="currentColor()"></span>
    <span class="font-mono text-gray-700 dark:text-gray-300">{{ displayValue() }}</span>
    <sv-icon
         name="chevron-down"
         [cssClass]="open()
           ? 'ml-auto h-3.5 w-3.5 shrink-0 text-gray-500 dark:text-gray-400 transition-transform duration-200 rotate-180'
           : 'ml-auto h-3.5 w-3.5 shrink-0 text-gray-500 dark:text-gray-400 transition-transform duration-200'"
         [strokeWidth]="2" />
  </button>

  <!-- ── Picker panel — rendered into document.body via body portal so it escapes
       ALL parent overflow:hidden and CSS transform containment. ── -->
  <ng-template #panelTpl>
    <div [id]="'cp-panel-' + _uid"
         class="max-w-[calc(100vw-1rem)] max-h-[calc(100vh-1rem)] overflow-y-auto rounded-2xl border border-gray-200/70 bg-white
                shadow-[0_24px_64px_-12px_rgba(0,0,0,0.18),0_8px_24px_-8px_rgba(0,0,0,0.08)]
                dark:border-gray-700/50 dark:bg-gray-900
                dark:shadow-[0_24px_64px_-12px_rgba(0,0,0,0.7),0_8px_24px_-8px_rgba(0,0,0,0.5)]"
         [style.position]="panelStyle()['position']"
         [style.zIndex]="_stackedPopup.zIndex() ?? panelStyle()['zIndex']"
         [style.width]="panelStyle()['width']"
         [style.top]="panelStyle()['top']"
      [style.maxHeight]="panelStyle()['maxHeight']"
         [style.bottom]="panelStyle()['bottom']"
         [style.left]="panelStyle()['left']"
         [style.right]="panelStyle()['right']"
      [style.maxWidth]="panelStyle()['maxWidth']"
         role="dialog"
         aria-modal="false"
         aria-label="Color picker">

      <!-- Gradient canvas — 2D saturation × brightness -->
      <div #gradientCanvas
           data-gradient
           tabindex="0"
           role="slider"
           aria-label="Saturation and brightness"
           aria-valuemin="0"
           aria-valuemax="100"
           [attr.aria-valuenow]="saturationValue()"
           [attr.aria-valuetext]="gradientValueText()"
           class="relative h-40 w-full cursor-crosshair select-none overflow-hidden
                  focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-white/80"
           [style.background]="hueColor()"
           (mousedown)="onGradientMousedown($event)"
           (touchstart)="onGradientTouch($event)"
           (keydown)="onGradientKeydown($event)">
        <div class="absolute inset-0" style="background:linear-gradient(to right,#fff,transparent)"></div>
        <div class="absolute inset-0" style="background:linear-gradient(to bottom,transparent,#000)"></div>
        <div class="pointer-events-none absolute -translate-x-1/2 -translate-y-1/2
                    h-4 w-4 rounded-full border-2 border-white
                    shadow-[0_0_0_1.5px_rgba(0,0,0,0.35)]"
             [style.left]="selectorPosition().left"
             [style.top]="selectorPosition().top"
             [style.background]="currentColor()"></div>
      </div>

      <!-- Controls -->
      <div class="space-y-3 p-3">

        <!-- Hue row -->
        <div class="flex items-center gap-2">
          <div class="h-8 w-8 shrink-0 rounded-lg border border-black/10 shadow-inner"
               [style.background]="currentColor()"></div>
          <div class="flex-1 space-y-1.5">
            <div #hueSlider
                 tabindex="0"
                 role="slider"
                 aria-label="Hue"
                 aria-valuemin="0"
                 aria-valuemax="360"
                 [attr.aria-valuenow]="hueValue()"
                 [attr.aria-valuetext]="hueValueText()"
                 class="relative h-3 w-full cursor-pointer rounded-full
                        focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-1"
                 style="background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)"
                 (mousedown)="onHueMousedown($event)"
                 (touchstart)="onHueTouch($event)"
                 (keydown)="onHueKeydown($event)">
              <div class="pointer-events-none absolute top-1/2 -translate-x-1/2 -translate-y-1/2
                          h-4 w-4 rounded-full border-2 border-white
                          shadow-[0_0_0_1px_rgba(0,0,0,0.25),0_2px_6px_rgba(0,0,0,0.3)]"
                   [style.left]="huePosition()"
                   [style.background]="hueColor()"></div>
            </div>

            @if (showAlpha()) {
              <div #alphaSlider
                   tabindex="0"
                   role="slider"
                   aria-label="Opacity"
                   aria-valuemin="0"
                   aria-valuemax="100"
                   [attr.aria-valuenow]="alphaValue()"
                   [attr.aria-valuetext]="alphaValue() + '%'"
                   class="relative h-3 w-full cursor-pointer rounded-full
                          focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 focus-visible:ring-offset-1"
                   style="background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:6px 6px;background-position:0 0,0 3px,3px -3px,-3px 0"
                   (mousedown)="onAlphaMousedown($event)"
                   (touchstart)="onAlphaTouch($event)"
                   (keydown)="onAlphaKeydown($event)">
                <div class="absolute inset-0 rounded-full"
                     [style.background]="'linear-gradient(to right,transparent,' + hueColor() + ')'"></div>
                <div class="pointer-events-none absolute top-1/2 -translate-x-1/2 -translate-y-1/2
                            h-4 w-4 rounded-full border-2 border-white
                            shadow-[0_0_0_1px_rgba(0,0,0,0.25)]"
                     [style.left]="(alpha() * 100) + '%'"></div>
              </div>
            }
          </div>
        </div>

        <!-- Hex input -->
        <div class="flex items-center gap-1.5">
          <span class="text-[10px] font-semibold uppercase tracking-widest text-gray-500 dark:text-gray-400">Hex</span>
          <!-- ★ The colour in words, for anyone who cannot see the swatch. Hidden
               visually because the swatch IS the visual version. -->
          <span class="sr-only" role="status">{{ colorName() }}</span>
          <input type="text"
                 aria-label="Hex color value"
                 class="h-7 flex-1 rounded-md border border-gray-200 bg-gray-50 px-2 font-mono
                        text-[12px] text-gray-800 transition focus:border-primary-400 focus:outline-none
                        focus:ring-1 focus:ring-primary-400/30
                        dark:border-gray-700 dark:bg-gray-800 dark:text-gray-200"
                 maxlength="7"
                 [(ngModel)]="hexInput"
                 (ngModelChange)="onHexChange($event)" />
        </div>

        <!--
          Contrast against a supplied background.

          ★★ The words carry the verdict, not the colour of the chip. A red chip
             saying "4.1:1" tells a colour-blind designer nothing that
             "fails WCAG for any text size" does not tell everybody.
          ★ `role="status"` so a screen-reader user hears the verdict change as
            they move the gradient handle, rather than having to go and look.
        -->
        @if (hasContrast()) {
          <div class="flex items-center gap-2">
            <span class="h-5 w-5 shrink-0 rounded-md border border-black/10" [style.background]="contrastBackground()" aria-hidden="true"></span>
            <span
              role="status"
              [class]="'flex-1 rounded-md px-2 py-1 text-[11px] font-medium ring-1 ' + contrastChipClass()"
            >{{ contrastSummary() }}</span>
          </div>
        }

        <!-- Swatches -->
        <div>
          <p [id]="_uid + '-presets'" class="mb-1.5 text-[10px] font-semibold uppercase tracking-widest text-gray-500 dark:text-gray-400">Presets</p>
          <div class="flex flex-wrap gap-1.5" role="group" [attr.aria-labelledby]="_uid + '-presets'">
            @for (sw of swatches(); track sw.value) {
              <button type="button"
                class="h-5 w-5 rounded-md border border-black/10 shadow-sm
                       transition-transform duration-100 hover:scale-110
                       focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
                [style.background]="sw.value"
                [title]="sw.label"
                [attr.aria-label]="sw.label"
                [attr.aria-pressed]="currentColor() === sw.value"
                (click)="selectSwatch(sw.value)">
                @if (currentColor() === sw.value) {
                  <sv-icon name="check" cssClass="m-auto h-3 w-3 text-white drop-shadow" [strokeWidth]="3" />
                }
              </button>
            }
          </div>
        </div>

      </div>
    </div><!-- /cp-panel -->
  </ng-template>

</div>
<!-- Validation error slot. swatch trigger is a plain button; error is associated by proximity -->
<sv-field-error [id]="errorId()" [message]="fieldError.resolvedError()" class="mt-1.5 block" />
