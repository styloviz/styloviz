<sv-chart-frame
  [loading]="loading()"
  [error]="error()"
  [isEmpty]="chartIsEmpty()"
  [filtered]="filtered()"
  [emptyMessage]="emptyMessage()"
  [height]="240"
  [notice]="pauseNotice()"
  (retry)="retry.emit()"
>

<div class="flex flex-col gap-3">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <div class="flex flex-wrap items-start justify-between gap-2">
    <div>
      <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-100">{{ title() }}</h3>
      @if (subtitle()) {
        <p class="mt-0.5 text-[11px] text-gray-500 dark:text-gray-400">{{ subtitle() }}</p>
      }
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-2">

      <!-- Feed state: the host's connection when it reports one, else the
           local LIVE badge. A LIVE badge over a dropped socket is the chart
           claiming a feed it does not have. -->
      @if (showConnection()) {
        <sv-connection-status
          [state]="connection()"
          [reconnectable]="reconnectable()"
          (reconnect)="reconnect.emit()"
        />
      } @else if (isRunning()) {
        <span class="flex items-center gap-1.5 rounded-full bg-accent-50 px-2.5 py-0.5
                     text-[11px] font-medium text-accent-700
                     dark:bg-accent-900/30 dark:text-accent-400">
          <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-accent-500"></span>
          LIVE
        </span>
      }

      <!-- Play / Pause -->
      <button
        type="button"
        (click)="toggle()"
        [attr.aria-label]="isRunning() ? 'Pause stream' : 'Start stream'"
        class="flex h-7 items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3
               text-[11.5px] font-medium text-gray-600 transition-colors
               hover:bg-gray-50 active:scale-95
               dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700/80
               focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500">
        @if (isRunning()) {
          <svg class="h-3 w-3 shrink-0" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
            <rect x="1.5" y="1" width="3.5" height="10" rx="0.5"/>
            <rect x="7"   y="1" width="3.5" height="10" rx="0.5"/>
          </svg>
          Pause
        } @else {
          <svg class="h-3 w-3 shrink-0" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
            <path d="M2.5 1.5 10 6 2.5 10.5z"/>
          </svg>
          Play
        }
      </button>

      <!-- Reset -->
      <button
        type="button"
        (click)="resetStream()"
        aria-label="Reset stream"
        class="flex h-7 items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3
               text-[11.5px] font-medium text-gray-600 transition-colors
               hover:bg-gray-50 active:scale-95
               dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700/80
               focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500">
        <svg class="h-3 w-3 shrink-0" viewBox="0 0 12 12" fill="none"
             stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M10 2.5A4.5 4.5 0 1 1 3 9" stroke-linecap="round"/>
          <polyline points="10,0.5 10,2.5 8,2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Reset
      </button>
    </div>
  </div>

  <!-- ── Chart ──────────────────────────────────────────────────────────── -->
  <div class="relative overflow-hidden" [style.height.px]="chartHeight()">
    <svg
      [attr.viewBox]="'0 0 ' + SVG_W + ' ' + chartHeight()"
      preserveAspectRatio="xMidYMid meet"
      class="h-full w-full"
      [attr.aria-label]="resolvedAriaLabel()"
      role="img"
    >

      <defs>
        <!-- Per-series vertical gradient for area fill -->
        @for (s of series(); track $index; let i = $index) {
          <linearGradient [attr.id]="gradId(i)" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   [attr.stop-color]="seriesColors()[i]" stop-opacity="0.28"/>
            <stop offset="85%"  [attr.stop-color]="seriesColors()[i]" stop-opacity="0.04"/>
            <stop offset="100%" [attr.stop-color]="seriesColors()[i]" stop-opacity="0"/>
          </linearGradient>
        }

        <!-- Strict clip: hide the extra (N+1th) point during scroll animation -->
        <clipPath [attr.id]="'lsc-clip-' + _uid">
          <rect
            x="0" [attr.y]="-8"
            [attr.width]="plotW()"
            [attr.height]="plotH() + 16"/>
        </clipPath>
      </defs>

      <g [attr.transform]="'translate(' + PAD.left + ',' + PAD.top + ')'">

        <!-- Grid lines -->
        @if (showGrid()) {
          @for (v of gridValues(); track $index) {
            <line
              [attr.x1]="0"       [attr.y1]="gridLineY(v)"
              [attr.x2]="plotW()" [attr.y2]="gridLineY(v)"
              stroke-width="1" stroke-dasharray="4 3"
              class="stroke-gray-200 dark:stroke-gray-700/60"/>
            <text
              [attr.x]="-6" [attr.y]="gridLineY(v) + 4"
              text-anchor="end" font-size="10"
              class="select-none fill-gray-400 dark:fill-gray-500">{{ fmtValue(v) }}</text>
          }
        }

        <!-- Baseline -->
        <line
          [attr.x1]="0"       [attr.y1]="plotH()"
          [attr.x2]="plotW()" [attr.y2]="plotH()"
          stroke-width="1"
          class="stroke-gray-200 dark:stroke-gray-700/60"/>

        <!-- X-axis tick labels -->
        @for (lbl of xLabels(); track lbl.x) {
          <text
            [attr.x]="lbl.x" [attr.y]="plotH() + 14"
            text-anchor="middle" font-size="10"
            class="select-none fill-gray-400 dark:fill-gray-500">{{ lbl.label }}</text>
        }

        <!-- ── Scrolling chart group ─────────────────────────────────── -->
        <g [attr.clip-path]="'url(#lsc-clip-' + _uid + ')'">
          <g
            [attr.transform]="'translate(' + slideX() + ',0)'"
            [style.transition]="slideTransition()">

            <!-- Area fills (rendered behind lines) -->
            @if (fillArea()) {
              @for (s of series(); track $index; let i = $index) {
                <path
                  [attr.d]="areaPath(i)"
                  [attr.fill]="'url(#' + gradId(i) + ')'"
                  fill-rule="nonzero"/>
              }
            }

            <!-- Lines -->
            @for (s of series(); track $index; let i = $index) {
              <path
                [attr.d]="linePath(i)"
                [attr.stroke]="seriesColors()[i]"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"/>
            }

            <!-- Latest-point pulse dots -->
            @for (s of series(); track $index; let i = $index) {
              @let buf = bufferData()[i];
              @if (buf && buf.length > 0) {
                <!-- Outer pulse ring -->
                <circle
                  [attr.cx]="xAt(buf.length - 1)"
                  [attr.cy]="yAt(buf[buf.length - 1])"
                  r="5"
                  [attr.fill]="seriesColors()[i]"
                  fill-opacity="0.2">
                  @if (isRunning()) {
                    <animate attributeName="r" values="5;9;5" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="fill-opacity" values="0.25;0;0.25" dur="1.5s" repeatCount="indefinite"/>
                  }
                </circle>
                <!-- Inner solid dot -->
                <circle
                  [attr.cx]="xAt(buf.length - 1)"
                  [attr.cy]="yAt(buf[buf.length - 1])"
                  r="3"
                  [attr.fill]="seriesColors()[i]"/>
              }
            }

          </g>
        </g>

        <!-- Right-edge gradient veil (matches card bg, so uses opacity trick) -->
        <defs>
          <linearGradient [attr.id]="'lsc-right-fade-' + _uid" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="white" stop-opacity="0"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
          </linearGradient>
        </defs>

      </g>
    </svg>
  </div>

  <!-- ── Legend ─────────────────────────────────────────────────────────── -->
  @if (showLegend()) {
    <div class="flex flex-wrap items-center gap-x-5 gap-y-1.5">
      @for (s of series(); track s.label; let i = $index) {
        <div class="flex items-center gap-1.5">
          <span class="h-px w-5 rounded-full" [style.background-color]="seriesColors()[i]"
                style="height:2px;display:inline-block;"></span>
          <span class="text-[11.5px] text-gray-500 dark:text-gray-400">{{ s.label }}</span>
        </div>
      }
      <span class="ml-auto tabular-nums text-[11px] text-gray-500 dark:text-gray-400">
        t&nbsp;=&nbsp;{{ pointCount() }}
      </span>
    </div>
  }

</div>

</sv-chart-frame>
