<sv-chart-frame
  [loading]="loading()"
  [error]="error()"
  [isEmpty]="chartIsEmpty()"
  [filtered]="filtered()"
  [emptyMessage]="emptyMessage()"
  [height]="height()"
  (retry)="retry.emit()"
>

<div svChartAnim [ngClass]="['flex flex-col gap-3', customClass()]" [style.--lc-anim-dur]="animDuration()">

  @if (title()) {
    <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300">{{ title() }}</h3>
  }

  <div class="w-full overflow-hidden">
    <!-- `group`, not `img`: the shapes below are focusable, and `img` is
         children-presentational — it would drop every one of them from the
         accessibility tree while leaving them in the tab order. -->
    <svg
      [attr.viewBox]="'0 0 ' + SVG_WIDTH + ' ' + svgH()"
      [attr.height]="svgH()"
      class="w-full"
      role="group"
      [attr.aria-label]="title() || 'Date-time category chart'"
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        @for (s of series(); track s.label; let si = $index) {
          <linearGradient [attr.id]="'dtc-area-' + _uid + '-' + si" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   [attr.stop-color]="seriesColors()[si]" stop-opacity="0.25" />
            <stop offset="100%" [attr.stop-color]="seriesColors()[si]" stop-opacity="0.02" />
          </linearGradient>
        }
        <clipPath [attr.id]="'dtc-clip-' + _uid">
          <rect x="0" y="0" [attr.width]="plotW()" [attr.height]="plotH()" />
        </clipPath>
      </defs>

      <g [attr.transform]="'translate(' + PAD.left + ',' + PAD.top + ')'">

        <!-- Horizontal grid lines -->
        @if (showGrid()) {
          @for (v of yTicks(); track v) {
            <line
              x1="0" [attr.y1]="yTickY(v)"
              [attr.x2]="plotW()" [attr.y2]="yTickY(v)"
              stroke="currentColor" class="text-gray-200 dark:text-gray-700" stroke-width="1"
            />
          }
        }

        <!-- Vertical category guide lines (subtle) -->
        @for (cat of categories(); track cat; let ci = $index) {
          @if (ci % labelStep() === 0 && showGrid()) {
            <line
              [attr.x1]="ci * xStep()" y1="0"
              [attr.x2]="ci * xStep()" [attr.y2]="plotH()"
              stroke="currentColor" class="text-gray-100 dark:text-gray-800" stroke-width="1"
            />
          }
        }

        <!-- Area fills -->
        @for (s of series(); track s.label; let si = $index) {
          @if (filled(s)) {
            <path
              [attr.d]="areaPath(s.data)"
              [attr.fill]="'url(#dtc-area-' + _uid + '-' + si + ')'"
              [attr.clip-path]="'url(#dtc-clip-' + _uid + ')'"
              class="bc-fade-in"
              [style.animation-delay]="si * 120 + 'ms'"
            />
          }
        }

        <!-- Series lines -->
        @for (s of series(); track s.label; let si = $index) {
          <path
            [attr.d]="linePath(s.data)"
            fill="none"
            [attr.stroke]="seriesColors()[si]"
            stroke-width="2"
            stroke-linejoin="round"
            stroke-linecap="round"
            class="lc-line"
            [attr.clip-path]="'url(#dtc-clip-' + _uid + ')'"
            [style.animation-delay]="si * 150 + 'ms'"
          />
        }

        <!-- Y-axis labels -->
        @for (v of yTicks(); track v) {
          <text
            x="-8" [attr.y]="yTickY(v) + 4"
            text-anchor="end"
            class="fill-gray-400 dark:fill-gray-500"
            style="font-size:10px;font-family:inherit;"
          >{{ fmt(v) }}</text>
        }

        <!-- X-axis date labels (rotated) -->
        @for (label of xLabels(); track $index; let ci = $index) {
          @if (ci % labelStep() === 0) {
            <text
              [attr.x]="ci * xStep()"
              [attr.y]="plotH() + 14"
              text-anchor="end"
              [attr.transform]="'rotate(-40,' + (ci * xStep()) + ',' + (plotH() + 14) + ')'"
              class="fill-gray-400 dark:fill-gray-500"
              style="font-size:10px;font-family:inherit;"
            >{{ label }}</text>
          }
        }

        <!-- Axes -->
        <line x1="0" [attr.y1]="plotH()" [attr.x2]="plotW()" [attr.y2]="plotH()"
          stroke="currentColor" class="text-gray-300 dark:text-gray-600" stroke-width="1" />
        <line x1="0" y1="0" x2="0" [attr.y2]="plotH()"
          stroke="currentColor" class="text-gray-300 dark:text-gray-600" stroke-width="1" />

        <!--
          Invisible hover overlay for tooltip (mouse).

          ★ `aria-hidden` IS WHAT MAKES THE MISSING KEY HANDLER CORRECT, not an
            oversight. This rect is a POINTER hit-area spanning the whole plot: it
            turns "anywhere near the line" into a crosshair reading, which is a
            gesture only a pointer has. Every category it can select is also a
            focusable `role="button"` rect below, carrying `tabindex`, an
            `aria-label` and both Enter and Space — so keyboard parity is complete
            without this node, and adding a handler here would put ONE tab stop in
            front of the whole chart that reports whichever category the mouse last
            happened to be over.

            Hiding it from the accessibility tree is the part that has to be
            explicit: an unlabelled full-plot rect exposed to a screen reader is a
            phantom target that shadows the real ones. `check:chart-keyboard`
            enforces this pairing — a click handler with no key handler is a build
            failure unless the node is `aria-hidden` AND listed there with a
            reason, so this comment cannot rot into a lie.
        -->
        <rect
          x="0" y="0"
          [attr.width]="plotW()"
          [attr.height]="plotH()"
          fill="transparent"
          aria-hidden="true"
          class="cursor-crosshair"
          (mousemove)="showTooltip($event)"
          (mouseleave)="hideTooltip()"
          (click)="selectFromMouse($event)"
        />

        <!-- Keyboard-focusable per-category hit columns (pointer-events off so they
             don't interfere with the mouse crosshair overlay above). -->
        @for (cat of categories(); track $index; let i = $index) {
          <rect
            [attr.x]="catColumnX(i) - xStep() / 2"
            y="0"
            [attr.width]="xStep()"
            [attr.height]="plotH()"
            fill="transparent"
            style="pointer-events:none"
            class="outline-none"
            tabindex="0"
            role="button"
            [attr.aria-label]="categoryAriaLabel(i)"
            (focus)="focusCategory(i)"
            (blur)="hideTooltip()"
            (keydown.enter)="selectCategory(i); $event.preventDefault()"
            (keydown.space)="selectCategory(i); $event.preventDefault()"
          />
        }

        <!-- Tooltip -->
        @if (tooltip().visible) {
          <g [attr.transform]="'translate(' + (tooltip().x - PAD.left) + ',' + tooltip().y + ')'">
            <rect x="0" y="0" rx="6" [attr.width]="148" [attr.height]="24 + tooltip().items.length * 16 + 8"
              fill="white" class="dark:fill-gray-800"
              style="filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15));"
            />
            <text x="10" y="16" style="font-size:11px;font-weight:600;font-family:inherit;"
              class="fill-gray-700 dark:fill-gray-200">{{ tooltip().label }}</text>
            @for (item of tooltip().items; track item.series; let i = $index) {
              <circle [attr.cx]="10" [attr.cy]="30 + i * 16" r="4" [attr.fill]="item.color" />
              <text [attr.x]="20" [attr.y]="34 + i * 16" style="font-size:10px;font-family:inherit;"
                class="fill-gray-500 dark:fill-gray-400">
                {{ item.series }}: <tspan style="font-weight:600;" class="fill-gray-700 dark:fill-gray-200">{{ fmt(item.value) }}</tspan>
              </text>
            }
          </g>
        }

      </g>
    </svg>
  </div>

  <!-- Legend -->
  @if (showLegend() && series().length > 1) {
    <div class="flex flex-wrap items-center justify-center gap-x-5 gap-y-1.5">
      @for (s of series(); track s.label; let i = $index) {
        <span class="flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400">
          <span class="inline-block h-0.5 w-5 shrink-0 rounded-full" [style.background]="seriesColors()[i]"></span>
          {{ s.label }}
        </span>
      }
    </div>
  }

</div>

</sv-chart-frame>
