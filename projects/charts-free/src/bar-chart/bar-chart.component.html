<sv-chart-frame
  [loading]="loading()"
  [error]="resolvedError()"
  [isEmpty]="chartIsEmpty()"
  [filtered]="filtered()"
  [emptyMessage]="emptyMessage()"
  [notice]="plotted().notice"
  [height]="height()"
  (retry)="retry.emit()"
>

<!-- Root wrapper -->
<div svChartAnim [ngClass]="['flex flex-col gap-3', customClass()]" [style.--bc-anim-dur]="animDuration()">

  <!-- Title -->
  @if (title()) {
    <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300">{{ title() }}</h3>
  }

  <!-- SVG Chart -->
  <div class="w-full overflow-hidden">
    <!--
      ★★ `role="group"`, NOT `role="img"`, BECAUSE THE MARKS ARE FOCUSABLE.

         `img` is a leaf role: its subtree is replaced by its own accessible name,
         so a focusable descendant is a control a screen reader has been told does
         not exist. axe reports it as `nested-interactive`, and it was real — this
         chart carried `role="img"` while its bars were given `tabindex="0"`
         and `role="button"`, which is a tab stop that announces nothing. `group`
         is the role that owns labelled children, and it is what every other
         interactive chart in the kit already uses.

         The chart keeps its accessible name either way; what changes is that the
         per-mark `aria-label`s become reachable instead of discarded.
    -->
    <svg
      [attr.viewBox]="'0 0 ' + SVG_WIDTH + ' ' + svgHeight()"
      [attr.height]="svgHeight()"
      class="w-full"
      role="group"
      [attr.aria-label]="resolvedAriaLabel()"
      xmlns="http://www.w3.org/2000/svg"
    >

      <!-- ── Plot area ────────────────────────────────────────────────── -->
      <g [attr.transform]="'translate(' + padding().left + ',' + padding().top + ')'">

        @if (orientation() === 'vertical') {

          <!-- ── Vertical orientation ──────────────────────────────── -->

          <!-- Grid lines -->
          @if (showGrid()) {
            @for (val of gridValues(); track val) {
              <line
                x1="0"
                [attr.y1]="gridLineY(val)"
                [attr.x2]="plotW()"
                [attr.y2]="gridLineY(val)"
                stroke="currentColor"
                class="text-gray-200 dark:text-gray-700"
                stroke-width="1"
              />
            }
          }

          <!-- Y-axis labels -->
          @if (showLabels()) {
            @for (val of gridValues(); track val) {
              <text
                x="-8"
                [attr.y]="gridLineY(val) + 4"
                text-anchor="end"
                class="fill-gray-400 dark:fill-gray-500"
                style="font-size:10px;font-family:inherit;"
              >{{ formatValue(val) }}</text>
            }
          }

          <!-- X-axis baseline -->
          <line
            x1="0"
            [attr.y1]="plotH()"
            [attr.x2]="plotW()"
            [attr.y2]="plotH()"
            stroke="currentColor"
            class="text-gray-300 dark:text-gray-600"
            stroke-width="1"
          />

          <!-- Bars -->
          @for (bar of verticalBars(); track $index) {
            <path
              [attr.d]="vertBarPath(bar.x, bar.y, bar.barW, bar.barH, bar.r)"
              [attr.fill]="bar.color"
              class="bc-bar-v transition-opacity duration-150 hover:opacity-75 cursor-pointer outline-none focus-visible:stroke-2 focus-visible:stroke-gray-900 dark:focus-visible:stroke-white"
              [style.animation-delay]="$index * 40 + 'ms'"
              tabindex="0"
              role="button"
              [attr.aria-label]="barAriaLabel(bar.cat, bar.series, bar.value, bar.clamped)"
              [attr.data-sv-clamped]="bar.clamped ? '' : null"
              (mouseenter)="showTooltip($event, bar.cat, bar.series, bar.value, bar.color)"
              (mouseleave)="hideTooltip()"
              (focus)="focusTooltip(bar.x, bar.y, bar.cat, bar.series, bar.value, bar.color)"
              (blur)="hideTooltip()"
              (click)="onBarClick(bar.cat, bar.series, bar.value)"
              (keydown.enter)="onBarKey($event, bar.cat, bar.series, bar.value)"
              (keydown.space)="onBarKey($event, bar.cat, bar.series, bar.value)"
            />
            <!-- Value labels on top of bar -->
            @if (showValues() && bar.barH > 16) {
              <text
                [attr.x]="bar.x + bar.barW / 2"
                [attr.y]="bar.y - 4"
                text-anchor="middle"
                class="fill-gray-600 dark:fill-gray-400"
                style="font-size:10px;font-weight:600;font-family:inherit;"
              >{{ formatValue(bar.value) }}</text>
            }
          }

          <!-- X-axis category labels -->
          @if (showLabels()) {
            @for (cat of categories(); track cat; let ci = $index) {
              <text
                [attr.x]="ci * (plotW() / categories().length) + (plotW() / categories().length) / 2"
                [attr.y]="plotH() + 20"
                text-anchor="middle"
                class="fill-gray-500 dark:fill-gray-400"
                style="font-size:11px;font-family:inherit;"
              >{{ cat }}</text>
            }
          }

        } @else {

          <!-- ── Horizontal orientation ─────────────────────────────── -->

          <!-- Grid lines (vertical) -->
          @if (showGrid()) {
            @for (val of gridValues(); track val) {
              <line
                [attr.x1]="gridLineX(val)"
                y1="0"
                [attr.x2]="gridLineX(val)"
                [attr.y2]="plotH()"
                stroke="currentColor"
                class="text-gray-200 dark:text-gray-700"
                stroke-width="1"
              />
            }
          }

          <!-- X-axis value labels -->
          @if (showLabels()) {
            @for (val of gridValues(); track val) {
              <text
                [attr.x]="gridLineX(val)"
                [attr.y]="plotH() + 18"
                text-anchor="middle"
                class="fill-gray-400 dark:fill-gray-500"
                style="font-size:10px;font-family:inherit;"
              >{{ formatValue(val) }}</text>
            }
          }

          <!-- Y-axis baseline -->
          <line
            x1="0"
            y1="0"
            x2="0"
            [attr.y2]="plotH()"
            stroke="currentColor"
            class="text-gray-300 dark:text-gray-600"
            stroke-width="1"
          />

          <!-- Bars -->
          @for (bar of horizontalBars(); track $index) {
            <path
              [attr.d]="horizBarPath(bar.x, bar.y, bar.barW, bar.barH, bar.r)"
              [attr.fill]="bar.color"
              class="bc-bar-h transition-opacity duration-150 hover:opacity-75 cursor-pointer outline-none focus-visible:stroke-2 focus-visible:stroke-gray-900 dark:focus-visible:stroke-white"
              [style.animation-delay]="$index * 50 + 'ms'"
              tabindex="0"
              role="button"
              [attr.aria-label]="barAriaLabel(bar.cat, bar.series, bar.value, bar.clamped)"
              [attr.data-sv-clamped]="bar.clamped ? '' : null"
              (mouseenter)="showTooltip($event, bar.cat, bar.series, bar.value, bar.color)"
              (mouseleave)="hideTooltip()"
              (focus)="focusTooltip(bar.barW, bar.y + bar.barH / 2, bar.cat, bar.series, bar.value, bar.color)"
              (blur)="hideTooltip()"
              (click)="onBarClick(bar.cat, bar.series, bar.value)"
              (keydown.enter)="onBarKey($event, bar.cat, bar.series, bar.value)"
              (keydown.space)="onBarKey($event, bar.cat, bar.series, bar.value)"
            />
            <!-- Value labels after bar -->
            @if (showValues() && bar.barW > 24) {
              <text
                [attr.x]="bar.barW + 4"
                [attr.y]="bar.y + bar.barH / 2 + 4"
                text-anchor="start"
                class="fill-gray-600 dark:fill-gray-400"
                style="font-size:10px;font-weight:600;font-family:inherit;"
              >{{ formatValue(bar.value) }}</text>
            }
          }

          <!-- Y-axis category labels -->
          @if (showLabels()) {
            @for (cat of categories(); track cat; let ci = $index) {
              <text
                x="-8"
                [attr.y]="ci * (plotH() / categories().length) + (plotH() / categories().length) / 2 + 4"
                text-anchor="end"
                class="fill-gray-500 dark:fill-gray-400"
                style="font-size:11px;font-family:inherit;"
              >{{ cat }}</text>
            }
          }

        }

        <!-- ── Tooltip ──────────────────────────────────────────────── -->
        @if (tooltip().visible) {
          <g [attr.transform]="'translate(' + tooltip().x + ',' + tooltip().y + ')'">
            <rect
              x="0" y="0" rx="6"
              width="124" height="52"
              fill="white"
              style="filter:drop-shadow(0 4px 10px rgba(0,0,0,0.14));"
            />
            <text x="10" y="18"
              style="font-size:11px;font-weight:600;font-family:inherit;fill:var(--color-gray-700);"
            >{{ tooltip().label }}</text>
            @for (item of tooltip().items; track item.series) {
              <circle cx="10" cy="34" r="4" [attr.fill]="item.color" />
              <text x="20" y="38"
                style="font-size:11px;font-family:inherit;fill:var(--color-gray-500);"
              >{{ item.series }}: <tspan style="font-weight:600;fill:var(--color-gray-900);">{{ formatValue(item.value) }}</tspan></text>
            }
          </g>
        }

      </g>

    </svg>
  </div>

  <!--
    The accessible alternative to the SVG: one semantic table saying what the
    picture says. This was a hand-rolled `<div class="sr-only"><table>` in seven
    chart templates, and the CSS was the hard part, not the markup — the trap it
    kept re-learning, and the reason the chart root no longer needs `relative`,
    is written up in `core/src/lib/a11y/data-summary-table.component.css`.
    Renders nothing when there are no rows, so it needs no guard here.
  -->
  <sv-data-summary-table [summary]="a11ySummary()" />

  <!-- Legend (only when multiple series) -->
  @if (showLegend() && datasets().length > 1) {
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 justify-center">
      @for (ds of datasets(); track ds.label; let i = $index) {
        <span class="flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400">
          <span class="inline-block h-2.5 w-2.5 shrink-0 rounded-sm"
                [style.background-color]="seriesColors()[i]"></span>
          {{ ds.label }}
        </span>
      }
    </div>
  }

</div>

</sv-chart-frame>
