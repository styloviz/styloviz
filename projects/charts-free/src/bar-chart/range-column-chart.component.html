<sv-chart-frame
  [loading]="loading()"
  [error]="resolvedError()"
  [isEmpty]="chartIsEmpty()"
  [filtered]="filtered()"
  [emptyMessage]="emptyMessage()"
  [notice]="plotted().notice"
  [height]="height()"
  (retry)="retry.emit()"
>

<div svChartAnim [ngClass]="['flex flex-col gap-3', customClass()]" [style.--bc-anim-dur]="animDuration()">

  @if (title()) {
    <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300">{{ title() }}</h3>
  }

  <div class="w-full overflow-hidden">
    <svg
      [attr.viewBox]="'0 0 ' + SVG_WIDTH + ' ' + svgHeight()"
      [attr.height]="svgHeight()"
      class="w-full"
      role="img"
      [attr.aria-label]="resolvedAriaLabel()"
      xmlns="http://www.w3.org/2000/svg"
    >
      <g [attr.transform]="'translate(' + PADDING.left + ',' + PADDING.top + ')'">

        <!-- Grid lines -->
        @if (showGrid()) {
          @for (val of gridValues(); track val) {
            <line
              x1="0" [attr.y1]="gridLineY(val)" [attr.x2]="plotW()" [attr.y2]="gridLineY(val)"
              stroke="currentColor" class="text-gray-200 dark:text-gray-700" stroke-width="1"
            />
          }
        }

        <!-- Y-axis labels -->
        @if (showLabels()) {
          @for (val of gridValues(); track val) {
            <text
              x="-8" [attr.y]="gridLineY(val) + 4" text-anchor="end"
              class="fill-gray-400 dark:fill-gray-500" style="font-size:10px;font-family:inherit;"
            >{{ formatValue(val) }}</text>
          }
        }

        <!-- X-axis baseline -->
        <line
          x1="0" [attr.y1]="plotH()" [attr.x2]="plotW()" [attr.y2]="plotH()"
          stroke="currentColor" class="text-gray-300 dark:text-gray-600" stroke-width="1"
        />

        <!-- Floating range bars -->
        @for (bar of rangeBars(); track $index) {
          <path
            [attr.d]="floatBarPath(bar.x, bar.y, bar.barW, bar.barH, bar.r)"
            [attr.fill]="bar.color"
            fill-opacity="0.85"
            class="bc-range-v transition-opacity duration-150 hover:opacity-100 cursor-pointer"
            [style.animation-delay]="$index * 50 + 'ms'"
            (mouseenter)="showTooltip($event, bar)"
            (mouseleave)="hideTooltip()"
          />

          @if (showValues() && bar.barH > 20) {
            <!-- High label -->
            <text
              [attr.x]="bar.x + bar.barW / 2" [attr.y]="bar.y - 4"
              text-anchor="middle" class="fill-gray-600 dark:fill-gray-400"
              style="font-size:9px;font-family:inherit;pointer-events:none;"
            >{{ formatValue(bar.high) }}</text>
            <!-- Low label -->
            <text
              [attr.x]="bar.x + bar.barW / 2" [attr.y]="bar.y + bar.barH + 11"
              text-anchor="middle" class="fill-gray-600 dark:fill-gray-400"
              style="font-size:9px;font-family:inherit;pointer-events:none;"
            >{{ formatValue(bar.low) }}</text>
          }
        }

        <!-- X-axis category labels -->
        @if (showLabels()) {
          @for (cat of categories(); track cat; let ci = $index) {
            <text
              [attr.x]="ci * (plotW() / categories().length) + (plotW() / categories().length) / 2"
              [attr.y]="plotH() + 20"
              text-anchor="middle" class="fill-gray-500 dark:fill-gray-400"
              style="font-size:11px;font-family:inherit;"
            >{{ cat }}</text>
          }
        }

        <!-- Tooltip -->
        @if (tooltip().visible) {
          <g [attr.transform]="'translate(' + tooltip().x + ',' + tooltip().y + ')'">
            <rect
              x="0" y="0" rx="6" width="152" [attr.height]="tooltipH()"
              fill="white" style="filter:drop-shadow(0 4px 10px rgba(0,0,0,0.14));"
            />
            <text x="10" y="18"
              style="font-size:11px;font-weight:600;font-family:inherit;fill:var(--color-gray-700);"
            >{{ tooltip().label }}</text>
            @for (item of tooltip().items; track item.series; let i = $index) {
              <circle [attr.cx]="10" [attr.cy]="33 + i * 18" r="4" [attr.fill]="item.color" />
              <text [attr.x]="20" [attr.y]="37 + i * 18"
                style="font-size:10px;font-family:inherit;fill:var(--color-gray-500);"
              >{{ item.series }}: <tspan style="font-weight:600;fill:var(--color-gray-900);">{{ formatValue(item.value) }}</tspan></text>
            }
          </g>
        }

      </g>
    </svg>
  </div>

  @if (showLegend() && datasets().length > 1) {
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 justify-center">
      @for (ds of datasets(); track ds.label; let i = $index) {
        <span class="flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400">
          <span class="inline-block h-2.5 w-2.5 shrink-0 rounded-sm"
                [style.background-color]="seriesColors()[i]"></span>
          {{ ds.label }}
        </span>
      }
    </div>
  }

</div>

</sv-chart-frame>
