<div class="w-full" role="group" [attr.aria-label]="label()">
  <div class="flex items-center gap-1" [ngClass]="size() === 'sm' ? 'gap-0.5' : 'gap-1'" aria-hidden="true">
    @for (i of segmentIndexes; track i) {
      <span
        class="block flex-1 rounded-full transition-colors duration-150"
        [ngClass]="[size() === 'sm' ? 'h-1' : 'h-1.5', segmentClass(i)]"
      ></span>
    }
  </div>

  <!--
    Plain text, NOT a live region. It used to be `role="status" aria-live="polite"`,
    which meant a screen-reader user was interrupted on every keystroke and read
    the band again — the field became unusable. The announcement below carries
    the same information, once typing stops and only when the band changed.
  -->
  <p class="mt-1.5 text-xs font-medium" [ngClass]="labelColorClass()" [attr.data-sv-band]="guidance().band">
    {{ displayLabel() }}
  </p>

  @if (breachNotice()) {
    <p
      class="mt-1.5 rounded-lg px-2 py-1 text-[11px] font-medium ring-1 ring-inset"
      [ngClass]="breachClass()"
      [attr.data-sv-breach]="breach()"
      [attr.aria-busy]="breach() === 'checking' || null"
    >{{ breachNotice() }}</p>
  }

  @if (showSuggestions() && guidance().suggestions.length > 0) {
    <ul class="mt-1 space-y-0.5 text-xs text-gray-500 dark:text-gray-400">
      <!-- Tracked by position: a suggestion has no identity beyond its text, so
           tracking the text re-creates the whole list on every edit (NG0956).
           These are text-only nodes with no state to carry, so the slot is the
           right key. -->
      @for (suggestion of guidance().suggestions; track $index) {
        <li class="flex items-start gap-1">
          <span aria-hidden="true">&middot;</span>
          <span>{{ suggestion }}</span>
        </li>
      }
    </ul>
  }

  <p class="sr-only" role="status" aria-live="polite">{{ announcement() }}</p>
</div>
