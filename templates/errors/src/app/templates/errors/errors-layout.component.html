<!--
  ★★ THE SHELL IS EXACTLY ONE VIEWPORT TALL, AND ONLY `<main>` SCROLLS.

  With `min-h-screen` the shell grew with its content, so the window scrolled
  and the page index went with it — the index of every page in the template was
  visible only on the pages short enough not to need it.

  `h-dvh` rather than `h-screen`: on mobile Safari and Chrome, `100vh` is the
  height with the URL bar *hidden*, so a `h-screen` shell is taller than the
  visible viewport and pins a footer just off the bottom of the screen. `dvh`
  tracks the bar as it collapses.
-->
<div class="tpl-errors flex h-dvh flex-col overflow-hidden bg-gray-50 dark:bg-gray-950">

  <!-- A hairline of brand colour, so the page is not entirely without identity. -->
  <div class="h-1 shrink-0 bg-gradient-to-r from-brand-600 via-brandaccent-500 to-brand-600" aria-hidden="true"></div>

  <header class="flex shrink-0 items-center justify-between px-5 py-5 sm:px-8">
    <a [routerLink]="brand.homeLink" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-900 dark:text-white">
      <img [src]="brand.logoSrc" [alt]="brand.logoAlt" class="h-6 w-6" width="24" height="24" />
      <span>{{ brand.name }}{{ brand.nameAccent }}</span>
    </a>

    <button
      type="button"
      (click)="theme.toggleTheme()"
      class="rounded-lg p-2 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-700
             focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500
             dark:hover:bg-white/[0.06] dark:hover:text-gray-200"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      <sv-icon [name]="theme.isDark() ? 'sun' : 'moon'" size="sm" />
    </button>
  </header>

  <!--
    ★★★ THE SCROLLER IS `<main>`; THE CENTRING IS ON A CHILD OF IT.

    `overflow-y-auto` together with `items-center` on the SAME element is the
    classic flex-centring trap: once the content is taller than the box, the
    overflow spills out of the *start* edge, and the top of it cannot be
    scrolled to — the heading of a long error page becomes unreachable.

    A `min-h-full` inner wrapper avoids it. When the content is short the
    wrapper is a full viewport and centres it; when the content is tall the
    wrapper grows to fit, the centring becomes a no-op, and `<main>` scrolls
    the whole of it with nothing clipped.
  -->
  <main class="min-h-0 flex-1 overflow-y-auto">
    <div class="flex min-h-full items-center justify-center px-5 py-10 sm:px-8">
      <router-outlet />
    </div>
  </main>

  <!--
    ★ DEMO CHROME. Fourteen pages nobody can find are fourteen pages nobody
    evaluates — but this is the first thing to delete when the shell goes into
    a real app. One `<footer>`; see CUSTOMIZING.md.
  -->
  <footer class="shrink-0 border-t border-gray-200 bg-white/60 px-5 py-4 sm:px-8 dark:border-gray-800 dark:bg-gray-900/40">
    <p class="text-center text-[11px] font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">
      Every page in this template
    </p>
    <nav class="mt-3 flex flex-wrap justify-center gap-1.5" aria-label="Error pages">
      @for (page of pages; track page.key) {
        <a
          [routerLink]="linkFor(page)"
          routerLinkActive="!border-brand-400 !text-gray-900 !bg-brand-50 dark:!bg-brand-500/15 dark:!text-white"
          class="rounded-lg border border-gray-200 bg-white px-2.5 py-1 font-mono text-xs text-gray-500 transition-colors hover:border-brand-300 hover:text-gray-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 dark:border-gray-800 dark:bg-gray-950 dark:text-gray-400 dark:hover:text-gray-100"
          [title]="page.title"
        >{{ page.code || page.key }}</a>
      }
    </nav>
  </footer>
</div>
