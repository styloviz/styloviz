<div class="w-full max-w-md text-center">

  <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-700 ring-1 ring-emerald-100 dark:bg-emerald-500/10 dark:text-emerald-300 dark:ring-emerald-400/20">
    <sv-icon name="check-circle" cssClass="h-7 w-7" />
  </span>

  <h1 class="mt-5 text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">
    You're signed in
  </h1>
  <p class="mt-2 text-sm leading-relaxed text-gray-500 dark:text-gray-400">
    The flow finished. In your app this is where you would redirect to wherever
    the user was headed — this page is the one file to delete when you wire the
    template in.
  </p>

  <div class="mt-7 flex flex-col gap-2">
    <sv-button
      variant="primary"
      size="lg"
      [block]="true"
      label="Back to sign in"
      icon="arrow-left"
      [href]="base + '/login'" />
    <sv-button
      btnStyle="ghost"
      variant="neutral"
      size="lg"
      [block]="true"
      label="Try the lock screen"
      [href]="base + '/lock'" />
  </div>

  <p class="mt-6 text-xs text-gray-500 dark:text-gray-400">
    Signed in as {{ user.name }}
  </p>
</div>
